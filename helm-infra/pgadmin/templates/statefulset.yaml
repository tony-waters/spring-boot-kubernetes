apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.pgadmin.names.app }}
  namespace: {{ .Values.pgadmin.namespaces.app }}
spec:
  serviceName: {{ .Values.pgadmin.names.app }}
  podManagementPolicy: Parallel
  replicas: 1
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: {{ .Values.pgadmin.names.app }}
  template:
    metadata:
      labels:
        app: {{ .Values.pgadmin.names.app }}
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: {{ .Values.pgadmin.names.app }}
          image: dpage/pgadmin4:9.14
          imagePullPolicy: Always
          env:
            - name: SCRIPT_NAME
              value: /pgadmin
            - name: PGADMIN_DEFAULT_EMAIL
              value: user@domain.com
            - name: PGADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.pgadmin.names.secret }}
                  key: pgadmin-password
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          volumeMounts:
            - name: pgadmin-config
              mountPath: /pgadmin4/servers.json
              subPath: servers.json
              readOnly: true
            - name: {{ .Values.pgadmin.names.volumeClaim }}
              mountPath: /var/lib/pgadmin
      volumes:
        - name: pgadmin-config
          configMap:
            name: {{ .Values.pgadmin.names.config }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Values.pgadmin.names.volumeClaim }}
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 3Gi