replicaCount: 1

database:
  mode: internal # internal | external

  internal:
    enabled: true
    serviceName: postgres
    port: 5432
    dbName: customerdb
    username: appuser
    existingSecret: ""
    secretName: postgres-secret
    storageClassName: ""
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  external:
    host: ""
    port: 5432
    dbName: ""
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    dbNameKey: database

