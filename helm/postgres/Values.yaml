replicaCount: 1

database:
  mode: internal # internal | external

  internal:
    enabled: true
    serviceName: postgres
    port: 5432
    dbName: customerdb
    username: appuser
    existingSecret: ""
    secretName: postgres-secret
    storageClassName: ""
    storageSize: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  external:
    host: ""
    port: 5432
    dbName: ""
    existingSecret: ""
    usernameKey: username
    passwordKey: password
    dbNameKey: database

app:
  image:
    repository: ghcr.io/your-org/your-app
    tag: latest
    pullPolicy: IfNotPresent

  replicas: 1

  service:
    port: 8080

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi

  env:
    springProfilesActive: kubernetes

migration:
  enabled: true
  image:
    repository: ghcr.io/your-org/your-app
    tag: latest
    pullPolicy: IfNotPresent

seed:
  enabled: false
  image:
    repository: ghcr.io/your-org/your-app
    tag: latest
    pullPolicy: IfNotPresent