apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: application
  namespace: application
spec:
  parentRefs:
    - kind: Gateway
      name: application-gateway
      namespace: application-gateway
  hostnames:
    - application
  rules:
    - backendRefs:
        - name: spring-boot-app
          port: 80

