apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pgadmin
  namespace: pgadmin
spec:
  parentRefs:
    - kind: Gateway
      name: application-gateway
      namespace: application-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /pgadmin
      backendRefs:
        - name: pgadmin
          port: 80