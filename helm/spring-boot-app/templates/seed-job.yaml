{{- if .Values.seedJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "spring-boot-app.fullname" . }}-seed
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "spring-boot-app.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.seedJob.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.seedJob.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "spring-boot-app.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed-job
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "spring-boot-app.fullname" . }}
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: {{ .Values.seedJob.springProfile | quote }}
            - name: JAVA_TOOL_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: {{ include "spring-boot-app.fullname" . }}
                  key: JAVA_OPTS
                  optional: true
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.usernameKey }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.passwordKey }}
          resources:
            {{- toYaml .Values.seedJob.resources | nindent 12 }}
{{- end }}